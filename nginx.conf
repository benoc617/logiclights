server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # ALB health check target
    location = /lights/health {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /lights/ {
        index index.html;
    }

    location = /lights {
        return 301 /lights/;
    }

    location = / {
        return 302 /lights/;
    }
}
