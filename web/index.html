<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Logic Lights — relays to CMOS, visualized</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💡</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1>⚡ Logic Lights</h1>
  <div id="picker" class="picker">
    <button id="picker-btn" type="button" title="Choose a circuit" aria-haspopup="listbox" aria-expanded="false">
      <span id="picker-label">…</span><span class="caret">▾</span>
    </button>
    <div id="picker-menu" class="picker-menu" role="listbox" hidden></div>
  </div>
  <div class="ctl">
    <label for="speed" title="Device switching time">🐢</label>
    <input id="speed" type="range" min="0" max="100" value="35">
    <span id="speed-label">300 ms</span>
  </div>
  <div class="ctl clockctl" id="clockctl" hidden>
    <button id="clk-run" title="Run or pause the clock">▶</button>
    <button id="clk-step" title="Step one half-cycle">⏭</button>
    <label for="clk-rate" title="Clock period">⏱</label>
    <input id="clk-rate" type="range" min="0" max="100" value="50">
    <span id="clk-label">1.2 s</span>
  </div>
  <div class="btns">
    <button id="panel-toggle" class="active" title="Binary input / output table">01</button>
    <button id="sound" title="Device sounds: relay clicks, transistor zzzt">🔊</button>
    <button id="zout" title="Zoom out">−</button>
    <button id="zin" title="Zoom in">+</button>
    <button id="fit" title="Fit to screen">⛶</button>
    <button id="reset" title="Rebuild circuit">↺</button>
  </div>
</header>
<main>
  <canvas id="view"></canvas>
  <aside id="panel" class="panel">
    <div class="panel-head">
      <span class="panel-title">Binary I/O</span>
      <button id="panel-close" title="Hide table">×</button>
    </div>
    <div id="panel-body"></div>
  </aside>
</main>
<footer>
  <span id="stats"></span>
  <span id="desc"></span>
  <button id="info-open" type="button" class="info-open" aria-haspopup="dialog">more info</button>
</footer>

<div id="info" class="info" hidden role="dialog" aria-modal="true" aria-labelledby="info-name">
  <div class="info-box" role="document">
    <div class="info-head">
      <div class="info-heading">
        <h2 id="info-name"></h2>
        <p id="info-title"></p>
      </div>
      <button id="info-close" type="button" title="Close">×</button>
    </div>
    <p id="info-brief" class="info-brief"></p>
    <div id="info-tabs" class="info-tabs" role="tablist">
      <button type="button" role="tab" data-tab="walkthrough" id="tab-walkthrough"
              aria-controls="pane-walkthrough">Walkthrough</button>
      <button type="button" role="tab" data-tab="engineering" id="tab-engineering"
              aria-controls="pane-engineering">Engineering detail</button>
    </div>
    <div class="info-body">
      <div id="pane-walkthrough" role="tabpanel" aria-labelledby="tab-walkthrough"></div>
      <div id="pane-engineering" role="tabpanel" aria-labelledby="tab-engineering" hidden></div>
    </div>
  </div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
